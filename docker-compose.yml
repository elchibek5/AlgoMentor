services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Unset by default, so the container starts in demo mode and needs no secrets.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
