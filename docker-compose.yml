version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000
    volumes:
      - .:/app
    command: ./mvnw spring-boot:run
    networks:
      - algomentor-network

networks:
  algomentor-network:
    driver: bridge
